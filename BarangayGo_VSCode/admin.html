<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | BarangayGo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <h2>BarangayGo Admin</h2>
    <button onclick="logout()">Logout</button>
</nav>

<main class="dashboard">
    <h1>Administrator Dashboard</h1>
    <p>Manage resident document requests.</p>

    <section class="panel">
        <h2>All Document Requests</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Reference No.</th>
                        <th>Resident</th>
                        <th>Mobile</th>
                        <th>Document</th>
                        <th>Purpose</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Update</th>
                    </tr>
                </thead>
                <tbody id="adminRequestTable"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
